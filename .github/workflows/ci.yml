name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC: full check including the slow retrain

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check autodrive tests
      - name: Type check
        run: python -m mypy --strict autodrive
      - name: Tests
        run: python -m pytest -q
      - name: Scenario scorecard (kinematic and dynamic vehicle)
        run: |
          python -m autodrive
          python -m autodrive --dynamic

  reproducibility:
    name: retrain the attention model bit for bit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Slow tests
        run: python -m pytest -q -m slow
      - name: Verify the shipped artifact
        run: python -m autodrive.attention verify
